<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: 100px 200px 100px;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-columns: 1fr 2fr 1fr;
        grid-template-columns: repeat(3, 1fr);

        grid-template-rows: 200px 100px 100px;

        gap: 10px;
      }
      .box1 {
        background-color: red;
        margin: 10px;
      }
      img {
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box1">
        <img
          src="../WhatsApp Image 2025-12-21 at 11.04.31 AM (1).jpeg"
          alt=""
        />
      </div>
      <div class="box1">Box-2</div>
      <div class="box1">Box-3</div>
      <div class="box1">Box-4</div>
      <div class="box1">Box-5</div>
      <div class="box1">Box-6</div>
      <div class="box1">Box-7</div>
      <div class="box1">Box-8</div>
      <div class="box1">Box-9</div>
    </div>
  </body>
</html>
