<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: 100px 200px 100px;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-columns: 1fr 2fr 1fr;
        grid-template-columns: repeat(3, 1fr);

        grid-template-rows: 200px 100px 100px;

        /* gap: 10px; */
      }
      .box1 {
        border: 1px solid black;
        background-color: red;
        /* margin: 10px; */
      }
      img {
        width: 100%;
        height: auto;
      }
      .box-1 {
        /* grid-column: span 2; */
        grid-column: 1/3;
      }
      .box-3 {
        /* grid-row: span 2; */
        grid-row: 2/4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box1 box-1">Box-1</div>
      <div class="box1 box-2">Box-2</div>
      <div class="box1 box-3">Box-3</div>
      <div class="box1 box-4">Box-4</div>
      <div class="box1 box-5">Box-5</div>
      <div class="box1 box-6">Box-6</div>
      <div class="box1 box-7">Box-7</div>
      <div class="box1 box-8">Box-8</div>
      <div class="box1 box-9">Box-9</div>
    </div>
  </body>
</html>
