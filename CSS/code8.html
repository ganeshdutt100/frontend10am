<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .mainDiv {
        background-color: aqua;
        width: 300px;
        height: 500px;
        position: relative;
      }
      .box {
        background-color: red;
        width: 100px;
        height: 100px;
        font-size: 20px;
        text-align: center;
        margin-top: 5px;
        color: white;
      }
      /*.box:hover {
        background-color: blue;
      }*/
      .box-2 {
        background-color: green;
      }

      .box-3 {
        background-color: rgb(43, 0, 128);
      }
      .box-4 {
        background-color: rgb(128, 124, 0);
        position: absolute;
        z-index: 1;
        top: 0;
        right: 0;
        bottom: 0;
        right: 0;
      }
      .box-5 {
        background-color: rgb(0, 105, 128);
      }
    </style>
  </head>
  <body>
    <div class="mainDiv">
      <div class="box box-1">1</div>
      <div class="box box-2">2</div>
      <div class="box box-3">3</div>
      <div class="box box-4">4</div>
      <div class="box box-5">5</div>
    </div>
  </body>
</html>
