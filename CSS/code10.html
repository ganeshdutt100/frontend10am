<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 100%;
        height: 300px;
        background-color: rgb(252, 83, 83);
        border: 4px solid rgb(221, 5, 5);
      }

      @media only screen and (min-width: 500px) {
        .box {
          background-color: rgb(114, 114, 241);
          border: 4px solid rgb(5, 23, 221);
        }
      }

      @media only screen and (min-width: 700px) {
        .box {
          background-color: rgb(241, 114, 233);
          border: 4px solid rgb(221, 5, 156);
        }
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
