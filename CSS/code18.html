<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 200px;
        height: 200px;
        border: 3px solid red;
        background: rgb(239, 101, 101);
        /* animation: name duration timing-function delay iteration-count direction fill-mode; */

        animation: box 5s linear infinite alternate;
      }

      /* @keyframes box {
        from {
          background-color: brown;
        }
        to {
          background-color: black;
        }
      } */

      @keyframes box {
        0% {
          background-color: brown;
        }
        20% {
          background-color: black;
        }
        40% {
          background-color: rgb(38, 167, 177);
        }
        60% {
          background-color: rgb(15, 163, 111);
        }
        70% {
          background-color: rgb(52, 126, 231);
        }
        100% {
          background-color: rgb(34, 193, 68);
        }
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
